name: Release Language Leaf

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching manifest.json (x.y.z, without v)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: language-leaf-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = file => JSON.parse(fs.readFileSync(file, 'utf8'));
          const manifest = read('manifest.json');
          const version = process.env.RELEASE_VERSION;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(manifest.id, 'language-leaf');
          assert.equal(version, manifest.version);
          assert.equal(version, read('package.json').version);
          assert.equal(version, read('package-lock.json').version);
          assert.equal(version, read('package-lock.json').packages[''].version);
          assert.equal(read('versions.json')[version], manifest.minAppVersion);
          JS
      - run: npm ci
      - run: npm run test:run -- --pool=forks --poolOptions.forks.singleFork
      - run: npm run build
      - name: Create release and upload plugin files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --generate-notes
